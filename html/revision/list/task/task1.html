
 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIST ASIGNMENT</title>
  </head>
  <body>
    <b>Disc bullets list</b>
    <br />
    <ul>
      <li>apples</li>
      <li>bananas</li>
      <li>lemons</li>
      <li>oranges</li>
    </ul>
    <br />
    <b>circle bullets list</b>
    <ul type="circle">
      <li>apples</li>
      <li>bananas</li>
      <li>lemons</li>
      <li>oranges</li>
    </ul>
    <br />
    <b>square bullets list</b>
    <ul type="square">
      <li>apples</li>
      <li>bananas</li>
      <li>lemons</li>
      <li>oranges</li>
    </ul>
</body>
</html>
